name: graphify-artifacts

# Builds and publishes the per-platform Graphify bundles `hive init` uses to
# construct Hive's local repository graph.
#
# It builds both darwin slices from graphify.lock, signs and notarizes them
# when the release secrets are configured (same secrets, same posture as
# release.yml — absent secrets publish unsigned and say so), smoke-tests each
# bundle, publishes the assets on the dedicated tag
# `graphify-v<pin>-hive.<build-number>`, then advances the signed runtime
# channel consumed by installed and development Hive.
#
# A notarization rejection fails the run BEFORE the tag exists (the same
# build-before-tag ordering as release.yml), so a bootloader Apple dislikes
# costs a build, never a published version.
on:
  push:
    branches: [main]
    paths:
      - graphify.lock
      - scripts/graphify/**
      - .github/workflows/graphify-artifacts.yml
  workflow_dispatch:
    inputs:
      build-number:
        description: "hive build number for this pin (the N in graphify-v<pin>-hive.N); bump when republishing the same pin"
        required: false

permissions:
  contents: write

concurrency:
  group: graphify-artifacts
  cancel-in-progress: false

jobs:
  build-and-publish:
    # macOS arm64: the arm64 slice builds natively and the x64 slice under
    # Rosetta 2 (measured working — graphify-bundling.md). PyInstaller cannot
    # cross-compile, so unlike the Bun slices both builds run through a real
    # interpreter of the target arch.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Choose the next immutable build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BUILD: ${{ inputs.build-number }}
        run: |
          set -euo pipefail
          pin="$(grep -m1 '^graphifyy==' graphify.lock | sed 's/graphifyy==//; s/ .*//; s/\\//')"
          build="${REQUESTED_BUILD:-}"
          if [ -z "$build" ]; then
            build=1
            while gh release view "graphify-v${pin}-hive.${build}" >/dev/null 2>&1; do
              build=$((build + 1))
            done
          fi
          tag="graphify-v${pin}-hive.${build}"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "base_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}" >> "$GITHUB_OUTPUT"

      - name: Install zstd and Rosetta 2
        run: |
          set -euo pipefail
          brew install zstd
          # arm64 runners need Rosetta for the x64 slice; a no-op if present.
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true

      # Same graceful degradation as release.yml: the certificate secret is
      # the one switch. Absent → unsigned artifacts, said out loud.
      - name: Set up signing keychain and notary key
        id: keychain
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "identity=" >> "$GITHUB_OUTPUT"
            echo "::warning::No MACOS_CERT_P12_BASE64 secret; publishing UNSIGNED, un-notarized bundles."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/graphify-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["]//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(
            security find-identity -v -p codesigning "$KEYCHAIN" \
              | awk -F'"' '/Developer ID Application/ {print $2; exit}'
          )"
          if [ -z "$identity" ]; then
            echo "::error::The certificate imported but holds no valid 'Developer ID Application' identity."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          printf '%s' "$NOTARY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarize, and smoke-test the bundles
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
          MACOS_NOTARY_KEY_PATH: ${{ steps.keychain.outputs.identity != '' && format('{0}/notary.p8', runner.temp) || '' }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: scripts/graphify/build.sh --build-number "${{ steps.release.outputs.build }}"

      - name: Write and sign the runtime manifest
        env:
          HIVE_RELEASE_PRIVATE_KEY: ${{ secrets.HIVE_RELEASE_PRIVATE_KEY }}
          HIVE_RELEASE_PUBLIC_KEY: ${{ secrets.HIVE_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [ -n "${HIVE_RELEASE_PRIVATE_KEY:-}" ] || { echo "::error::HIVE_RELEASE_PRIVATE_KEY is required"; exit 1; }
          [ -n "${HIVE_RELEASE_PUBLIC_KEY:-}" ] || { echo "::error::HIVE_RELEASE_PUBLIC_KEY is required"; exit 1; }
          bun run scripts/graphify/write-manifest.ts \
            --out dist/graphify \
            --manifest dist/graphify-runtime.json \
            --build "${{ steps.release.outputs.build }}" \
            --source "$GITHUB_SHA" \
            --base-url "${{ steps.release.outputs.base_url }}"
          bun run scripts/signing/sign-manifest.ts dist/graphify-runtime.json
          bun run scripts/graphify/verify-manifest.ts dist/graphify-runtime.json

      - name: Publish the immutable release and advance the signed channel
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.keychain.outputs.identity != '' }}
        run: |
          set -euo pipefail
          pin="${{ steps.release.outputs.pin }}"
          tag="${{ steps.release.outputs.tag }}"
          build="${{ steps.release.outputs.build }}"
          if [ "$SIGNED" = "true" ]; then
            signed_line="Bundles are Developer ID-signed with the hardened runtime and notarized."
          else
            signed_line="Bundles are UNSIGNED: no signing certificate was configured for this run."
          fi
          gh release create "$tag" \
            dist/graphify/*.tar.zst dist/graphify/*.sha256 \
            dist/graphify-runtime.json dist/graphify-runtime.json.sig \
            --title "graphify $pin (hive build $build)" \
            --latest=false \
            --notes "Standalone Graphify bundles used by Hive. $signed_line"
          if gh release view graphify-channel >/dev/null 2>&1; then
            gh release upload graphify-channel \
              dist/graphify-runtime.json dist/graphify-runtime.json.sig --clobber
          else
            gh release create graphify-channel \
              dist/graphify-runtime.json dist/graphify-runtime.json.sig \
              --title "Graphify runtime channel" \
              --latest=false \
              --notes "Signed pointer to the latest compatible Graphify runtime."
          fi
